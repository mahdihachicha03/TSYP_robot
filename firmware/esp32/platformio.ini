; ESP32 low-level controller: encoders, wheel PID, MMA8452Q, serial link to the Pi.
; Build:   pio run
; Flash:   pio run -t upload --upload-port /dev/esp32
; Monitor: pio device monitor -p /dev/esp32

[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = -Wall
