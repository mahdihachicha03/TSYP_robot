# robot_localization EKF: fuses track odometry and the MPU6050 into odom -> base_link.
# Tracks slip sideways when turning, so yaw rate comes from the gyro and only
# forward/sideways velocity comes from the encoders.
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    #            x      y      z      roll   pitch  yaw
    #            vx     vy     vz     vroll  vpitch vyaw
    #            ax     ay     az
    odom0: /wheel/odom
    odom0_config: [false, false, false, false, false, false,
                   true,  true,  false, false, false, false,
                   false, false, false]
    odom0_differential: false

    imu0: /imu/data_raw
    imu0_config: [false, false, false, false, false, false,
                  false, false, false, false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true
